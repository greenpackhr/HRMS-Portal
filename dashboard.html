<!DOCTYPE html>
<html>

<head>

<title>Greenpack HRMS Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="header">

<h1>Greenpack HRMS</h1>
<p>Employee Attendance Portal</p>

</div>



<div class="container">


<div class="welcome">

<h2>
Welcome, <span id="empName">Employee</span>
</h2>

</div>



<div class="employee-card">


<div>
<label>Employee ID</label>
<h3 id="empId"></h3>
</div>


<div>
<label>Department</label>
<h3 id="department">-</h3>
</div>


<div>
<label>Designation</label>
<h3 id="designation">-</h3>
</div>


</div>




<div class="summary">


<div class="box">
<h2 id="present">0</h2>
<p>Present</p>
</div>


<div class="box">
<h2 id="absent">0</h2>
<p>Absent</p>
</div>


<div class="box">
<h2 id="wo">0</h2>
<p>Weekly Off</p>
</div>


<div class="box">
<h2 id="payday">0</h2>
<p>Pay Days</p>
</div>


</div>





<h2>Attendance Details</h2>


<table>


<thead>

<tr>

<th>Date</th>
<th>Schedule</th>
<th>In Time</th>
<th>Out Time</th>
<th>Work Time</th>
<th>Status</th>

</tr>

</thead>


<tbody id="attendanceTable">


</tbody>


</table>



<br>

<button onclick="logout()">Logout</button>



</div>



<script src="dashboard.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const empId = localStorage.getItem("empId");

    if (!empId) {

        window.location.href = "index.html";

        return;

    }

    const empName = localStorage.getItem("empName");

    if (empName) {

        const welcome = document.getElementById("welcomeName");

        if (welcome) {

            welcome.innerHTML = "Welcome, " + empName;

        }

    }

});


function logout() {

    localStorage.clear();

    window.location.href = "index.html";

}

</script>
</body>

</html>
