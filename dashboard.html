<!DOCTYPE html>
<html>

<head>

<title>Greenpack HRMS Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="header">

    <div class="header-left">
        <h1>Greenpack HRMS</h1>
        <p>Employee Attendance Portal</p>
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</div>



<div class="container">


<div class="welcome">

<h2>
Welcome, <span id="empName">Employee</span>
</h2>

</div>



<div class="employee-card">


<div>
<label>Employee ID</label>
<h3 id="empId"></h3>
</div>


<div>
<label>Department</label>
<h3 id="department">-</h3>
</div>


<div>
<label>Designation</label>
<h3 id="designation">-</h3>
</div>


</div>




<div class="summary">

    <div class="box present-card">
            <h2 id="present">0</h2>
        <p>Present</p>
    </div>

    <div class="box absent-card">
            <h2 id="absent">0</h2>
        <p>Absent</p>
    </div>

    <div class="box wo-card">
            <h2 id="wo">0</h2>
        <p>Weekly Off</p>
    </div>

    <div class="box payday-card">
                <h2 id="payday">0</h2>
        <p>Pay Days</p>
    </div>

</div>






<h2>Attendance Details</h2>


<table class="attendance-table">


<thead>

<tr>

<th>Date</th>
<th>Schedule</th>
<th>In Time</th>
<th>Out Time</th>
<th>Work Time</th>
<th>Status</th>

</tr>

</thead>


<tbody id="attendanceTable">


</tbody>


</table>









</div>



<script src="dashboard.js"></script>


</body>

</html>
