<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <img src="images/logo.png" alt="Company Logo" height="60">
    <h2>Greenpack Industries HRMS</h2>
</div>

<div class="container">

    <h2>Welcome</h2>

    <p id="empName"></p>
    <p><strong>Employee ID:</strong> <span id="empId"></span></p>

    <hr>

    <h3>My Attendance</h3>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Date</th>
                <th>Schedule</th>
                <th>In Time</th>
                <th>Out Time</th>
                <th>Work Time</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="attendanceTable">

        </tbody>

    </table>

    <br>

    <button onclick="logout()">Logout</button>

</div>

<script src="dashboard.js"></script>

</body>
</html>
