<!DOCTYPE html>

<html>

<head>
<title>HR Leave Approval</title>
<link rel="stylesheet" href="dashboard.css">

<style>

/* =========================
   LEAVE APPROVAL PAGE
========================= */

body {
    background: #f4f7f5;
}

/* HEADER */

.leave-header {
    background: linear-gradient(135deg, #0f4d2d, #1b6b3a);
    color: white;
    padding: 18px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

.leave-header-left h1 {
    margin: 0;
    font-size: 25px;
}

.leave-header-left p {
    margin: 5px 0 0;
    font-size: 14px;
    opacity: .85;
}

.logout-btn {
    background: rgba(255,255,255,.14);
    color: white;
    border: 1px solid rgba(255,255,255,.3);
    padding: 10px 20px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.logout-btn:hover {
    background: rgba(255,255,255,.25);
}

/* MAIN */

.leave-container {
    max-width: 1250px;
    margin: 0 auto;
    padding: 30px 25px 50px;
}

/* PAGE TITLE */

.leave-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.leave-title-row h2 {
    margin: 0;
    color: #183c27;
    font-size: 24px;
}

.pending-count {
    background: #e8f5ec;
    color: #18703b;
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
}

/* REQUEST CARD */

.leave-request-card {
    background: white;
    border: 1px solid #e0e7e2;
    border-radius: 17px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(20,55,35,.07);
    transition: .2s ease;
}

.leave-request-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 26px rgba(20,55,35,.11);
}

/* TOP */

.request-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.employee-section {
    display: flex;
    align-items: center;
    gap: 13px;
}

.employee-avatar {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg,#d9efe0,#bfe0ca);
    color: #15572e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 17px;
}

.employee-name {
    font-size: 17px;
    font-weight: 700;
    color: #263a2e;
}

.employee-details {
    margin-top: 4px;
    color: #7a867f;
    font-size: 13px;
}

/* LEAVE TYPE */

.leave-type-badge {
    padding: 7px 13px;
    border-radius: 9px;
    background: #eef7f1;
    color: #1c6739;
    font-size: 12px;
    font-weight: 800;
}

/* DETAILS */

.request-details {
    display: grid;
    grid-template-columns: 1.5fr .7fr 1.5fr;
    gap: 15px;
    margin-top: 20px;
    padding: 17px;
    background: #f8fbf9;
    border-radius: 12px;
}

.detail-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: #89958e;
    margin-bottom: 5px;
}

.detail-value {
    font-size: 14px;
    font-weight: 700;
    color: #294233;
}

/* REASON */

.reason-box {
    margin-top: 15px;
    padding: 13px 15px;
    border-left: 4px solid #1b6b3a;
    background: #f8fbf9;
    border-radius: 7px;
}

.reason-label {
    font-size: 11px;
    text-transform: uppercase;
    color: #89958e;
    margin-bottom: 4px;
}

.reason-text {
    font-size: 14px;
    color: #394a40;
}

/* BOTTOM */

.request-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 17px;
    border-top: 1px solid #edf1ee;
}

.request-date {
    font-size: 12px;
    color: #89958e;
}

/* ACTIONS */

.action-buttons {
    display: flex;
    gap: 9px;
}

.approve-btn,
.reject-btn {
    border: none;
    padding: 9px 17px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.approve-btn {
    background: #e5f5e9;
    color: #19733c;
}

.approve-btn:hover {
    background: #d1edda;
}

.reject-btn {
    background: #fdeaea;
    color: #c62828;
}

.reject-btn:hover {
    background: #fbd6d6;
}

/* EMPTY */

.no-leaves {
    background: white;
    border: 1px solid #e0e7e2;
    border-radius: 17px;
    padding: 55px 20px;
    text-align: center;
    color: #89958e;
    box-shadow: 0 5px 20px rgba(20,55,35,.05);
}

.no-leaves-icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.no-leaves-title {
    font-size: 17px;
    font-weight: 700;
    color: #526158;
}

.no-leaves-text {
    margin-top: 5px;
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 700px) {

    .leave-header {
        padding: 15px 18px;
    }

    .leave-header-left h1 {
        font-size: 20px;
    }

    .leave-container {
        padding: 20px 12px 35px;
    }

    .leave-title-row {
        align-items: flex-start;
        gap: 10px;
    }

    .leave-title-row h2 {
        font-size: 20px;
    }

    .request-top {
        align-items: flex-start;
    }

    .request-details {
        grid-template-columns: 1fr;
    }

    .request-bottom {
        align-items: stretch;
        flex-direction: column;
        gap: 13px;
    }

    .action-buttons {
        width: 100%;
    }

    .approve-btn,
    .reject-btn {
        flex: 1;
    }

}

</style>

</head>

<body>

<header class="leave-header">

```
<div class="leave-header-left">
    <h1>Greenpack HRMS</h1>
    <p>Human Resource Management • Leave Approval</p>
</div>

<button type="button" class="logout-btn" onclick="logout()">
    Logout
</button>
```

</header>

<main class="leave-container">

```
<div class="leave-title-row">

    <h2>Pending Leave Requests</h2>

    <div class="pending-count" id="pendingCount">
        0 Pending
    </div>

</div>


<div id="leaveTable">

</div>
```

</main>

<script>

function logout() {

    localStorage.clear();

    window.location.href = "index.html";

}

</script>

<script src="hr-leave.js"></script>

</body>

</html>
