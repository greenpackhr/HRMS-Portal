<!DOCTYPE html>
<html>
<head>
    <title>Leave Application - Greenpack HRMS</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="header">
    <div class="header-left">
        <h1>Greenpack HRMS</h1>
        <p>Leave Application</p>
    </div>

    <button class="logout-btn" onclick="window.location='dashboard.html'">
        Back
    </button>
</div>

<div class="container">

    <!-- Leave Application -->
    <div class="welcome">
        <h2>Leave Application</h2>
    </div>

    <div class="employee-card">

        <div>
            <label>Leave Type</label>
            <select id="leaveType">
                <option value="">Select Leave</option>
                <option value="CL">Casual Leave (CL)</option>
                <option value="SL">Sick Leave (SL)</option>
                <option value="PL">Privilege Leave (PL)</option>
                <option value="OD">On Duty (OD)</option>
            </select>
        </div>

        <div>
            <label>From Date</label>
            <input type="date" id="fromDate">
        </div>

        <div>
            <label>To Date</label>
            <input type="date" id="toDate">
        </div>

    </div>
    <!-- Medical Fitness -->
<div id="medicalFitnessBox" style="display:none;">
    <label>Medical Fitness Certificate</label>
    <input type="file"
           id="medicalFitness"
           accept=".pdf,.jpg,.jpeg,.png">

    <small style="display:block;margin-top:5px;color:#666;">
        Required for continuous SL leave exceeding 3 days.
    </small>
</div>

    <div class="welcome" style="margin-top:20px;">

        <label>Reason</label><br><br>

        <textarea id="reason"
                  rows="4"
                  style="width:100%;padding:10px;"
                  placeholder="Enter Leave Reason"></textarea>

        <br><br>

        <button onclick="applyLeave()">
            Submit Leave
        </button>

    </div>

    <!-- Leave Balance -->
    <div class="welcome" style="margin-top:30px;">
        <h2>Leave Balance</h2>

        <table class="attendance-table">
            <thead>
                <tr>
                    <th>CL</th>
                    <th>SL</th>
                    <th>PL</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td id="clBalance">0</td>
                    <td id="slBalance">0</td>
                    <td id="plBalance">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- My Leave History -->
    <div class="welcome" style="margin-top:30px;">
        <h2>My Leave History</h2>

        <table class="attendance-table">

            <thead>
                <tr>
                    <th>Leave Type</th>
                    <th>From Date</th>
                    <th>To Date</th>
                    <th>Days</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="historyTable">

            </tbody>

        </table>
    </div>

</div>

<script src="leave.js"></script>    
<script src="leave.js"></script>

</body>
</html>
